<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Neon Sky Survivors MVP</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="hud" class="hud" aria-live="polite"></section>
      <canvas id="arena" width="420" height="720" hidden></canvas>
      <section id="panel" class="panel"></section>
      <nav class="controls" aria-label="Game controls">
        <button id="primaryButton">Play</button>
        <button id="dashButton">Dash</button>
        <button id="pauseButton">Pause</button>
        <button id="garageButton">Garage</button>
        <button id="settingsButton">Settings</button>
      </nav>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
